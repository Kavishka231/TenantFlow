[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "tenantflow-backend"
version = "0.1.0"
description = "FastAPI foundation for TenantFlow's gradual backend migration"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]==3.3.6",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "sqlalchemy==2.1.6",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true
