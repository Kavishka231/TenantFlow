name: Dependency and container verification

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit application dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up application Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Build backend dependency inventory
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/backend-requirements.txt"

      - name: Set up isolated audit Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Audit backend dependency inventory
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          python -m pip_audit --strict --no-deps --desc off -r "${RUNNER_TEMP}/backend-requirements.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependency tree
        working-directory: frontend
        run: npm ci --no-audit

      - name: Audit frontend dependency tree
        working-directory: frontend
        run: npm audit --audit-level=high --fetch-retries=2 --fetch-timeout=60000

  container-builds:
    name: Build production containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build FastAPI image
        run: docker build --tag tenantflow-backend:ci backend

      - name: Build Next.js image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder-key
          --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          --tag tenantflow-frontend:ci
          frontend

      - name: Inspect non-root image users
        run: |
          test "$(docker image inspect tenantflow-backend:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect tenantflow-frontend:ci --format '{{.Config.User}}')" = "1001:1001"

