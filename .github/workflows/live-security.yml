name: Live security verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenantflow-live-security
  cancel-in-progress: false

jobs:
  verify:
    name: RLS, Stripe sandbox, and authenticated browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tenantflow-live-security
    env:
      CI: "true"
      ENVIRONMENT: test
      DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.LIVE_MIGRATION_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.LIVE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LIVE_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LIVE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LIVE_SUPABASE_PUBLISHABLE_KEY }}
      RLS_TEST_OWNER_ID: ${{ secrets.LIVE_RLS_TEST_OWNER_ID }}
      RLS_TEST_ADMIN_ID: ${{ secrets.LIVE_RLS_TEST_ADMIN_ID }}
      RLS_TEST_MEMBER_ID: ${{ secrets.LIVE_RLS_TEST_MEMBER_ID }}
      RLS_TEST_OUTSIDER_ID: ${{ secrets.LIVE_RLS_TEST_OUTSIDER_ID }}
      E2E_USER_EMAIL: ${{ secrets.LIVE_E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.LIVE_E2E_USER_PASSWORD }}
      E2E_SECOND_USER_EMAIL: ${{ secrets.LIVE_E2E_SECOND_USER_EMAIL }}
      E2E_SECOND_USER_PASSWORD: ${{ secrets.LIVE_E2E_SECOND_USER_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.LIVE_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.LIVE_STRIPE_WEBHOOK_SECRET }}
      STRIPE_STARTER_PRICE_ID: ${{ secrets.LIVE_STRIPE_STARTER_PRICE_ID }}
      STRIPE_GROWTH_PRICE_ID: ${{ secrets.LIVE_STRIPE_GROWTH_PRICE_ID }}
      STRIPE_WEBHOOK_DATABASE_URL: ${{ secrets.LIVE_STRIPE_WEBHOOK_DATABASE_URL }}
      STRIPE_WEBHOOK_PROCESSOR: python
      TENANTFLOW_BACKEND: fastapi
      FASTAPI_INTERNAL_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FRONTEND_APP_URL: http://127.0.0.1:3100
      CORS_ORIGINS: http://127.0.0.1:3100
      INVITATION_DEV_OUTBOX: "true"
      VALIDATE_DATABASE_ROLE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject incomplete or unsafe live configuration
        shell: bash
        run: |
          required=(
            DATABASE_URL MIGRATION_DATABASE_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY
            RLS_TEST_OWNER_ID RLS_TEST_ADMIN_ID RLS_TEST_MEMBER_ID RLS_TEST_OUTSIDER_ID
            E2E_USER_EMAIL E2E_USER_PASSWORD E2E_SECOND_USER_EMAIL E2E_SECOND_USER_PASSWORD
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_STARTER_PRICE_ID
            STRIPE_GROWTH_PRICE_ID STRIPE_WEBHOOK_DATABASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required live-verification secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          [[ "$STRIPE_SECRET_KEY" == sk_test_* ]] || {
            echo "LIVE_STRIPE_SECRET_KEY must be a Stripe Test Mode key." >&2
            exit 1
          }
          [[ "$DATABASE_URL" != "$MIGRATION_DATABASE_URL" ]] || {
            echo "Runtime and migration database credentials must be different." >&2
            exit 1
          }
          [[ "$DATABASE_URL" != "$STRIPE_WEBHOOK_DATABASE_URL" ]] || {
            echo "Runtime and webhook database credentials must be different." >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend in isolated environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -e "backend[dev]"

      - name: Verify roles, migrations, identities, and webhook isolation
        run: backend/.venv/bin/tenantflow-readiness

      - name: Run live backend RLS tests
        run: backend/.venv/bin/pytest backend/tests/integration --junitxml="${RUNNER_TEMP}/backend-live.xml"

      - name: Require complete backend live results
        run: python scripts/ci/require_test_results.py junit "${RUNNER_TEMP}/backend-live.xml"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run live frontend RLS tests
        working-directory: frontend
        run: npm run test:rls -- --reporter=junit --outputFile="${RUNNER_TEMP}/frontend-live.xml"

      - name: Require complete frontend live results
        run: python scripts/ci/require_test_results.py junit "${RUNNER_TEMP}/frontend-live.xml"

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Playwright and Stripe Test Mode checks
        working-directory: frontend
        run: npx playwright test --reporter=json > "${RUNNER_TEMP}/playwright-live.json"

      - name: Require complete browser live results
        run: python scripts/ci/require_test_results.py playwright "${RUNNER_TEMP}/playwright-live.json"
