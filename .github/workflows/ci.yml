name: Continuous integration

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run Ruff
        run: ruff check app tests

      - name: Run strict mypy
        run: mypy app tests

      - name: Run backend unit and contract tests
        run: pytest --ignore=tests/integration

  frontend:
    name: Frontend quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      DATABASE_URL: postgresql://runtime:placeholder@127.0.0.1:5432/tenantflow
      MIGRATION_DATABASE_URL: postgresql://migration:placeholder@127.0.0.1:5432/tenantflow
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      TENANTFLOW_BACKEND: fastapi
      TENANTFLOW_FASTAPI_URL: http://127.0.0.1:8000
      STRIPE_WEBHOOK_PROCESSOR: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Check Drizzle schema and migrations
        run: npm run db:check

      - name: Run frontend unit and contract tests
        run: npm run test:run -- --exclude "src/db/*.integration.test.ts"

      - name: Build Next.js production bundle
        run: npm run build
